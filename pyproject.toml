[project]
name = "medium-cli"
version = "0.1.0"
description = "聚合各平台社交媒体的统一命令行工具 -- 知乎/小红书/B站/微博/豆瓣/V2EX/X/Reddit/Telegram/Discord/公众号/BOSS直聘"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
medium-cli = "medium_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medium_cli"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]